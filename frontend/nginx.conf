server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API al backend.
    # El asistente con LLM local (CPU) puede tardar en la primera respuesta,
    # así que damos margen amplio al timeout.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy del WebSocket (precios y notificaciones en vivo)
    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Cache de assets estáticos
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
